# macOS install commands — brew, pip, mas

- id: macos_brew_install
  platform: darwin
  shell: [bash, zsh]
  intent: [install_package, install_global]
  command: brew install $PACKAGE
  verify: brew list $PACKAGE
  vars: [PACKAGE]
  confidence: 0.95
  requires: [brew]
  forbidden_shells: [powershell, pwsh, cmd]

