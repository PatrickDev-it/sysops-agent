# Linux install commands — apt, dnf, pacman, pip

- id: linux_apt_install
  platform: linux
  distros: [ubuntu, debian, mint, pop_os]
  shell: [bash, zsh, sh]
  intent: [install_package, install_global]
  command: sudo apt-get install -y $PACKAGE
  verify: dpkg -l $PACKAGE
  vars: [PACKAGE]
  confidence: 0.95
  requires: [apt]
  forbidden_shells: [powershell, pwsh, cmd]

- id: linux_apt_update
  platform: linux
  distros: [ubuntu, debian, mint, pop_os]
  shell: [bash, zsh, sh]
  intent: [update_package_list, refresh_repos]
  command: sudo apt-get update
  vars: []
  confidence: 0.98
  requires: [apt]
  forbidden_shells: [powershell, pwsh, cmd]

- id: linux_apt_remove
  platform: linux
  distros: [ubuntu, debian, mint, pop_os]
  shell: [bash, zsh, sh]
  intent: [uninstall_package, remove_package]
  command: sudo apt-get remove -y $PACKAGE
  vars: [PACKAGE]
  confidence: 0.95
  requires: [apt]

- id: linux_dnf_install
  platform: linux
  distros: [fedora, rhel, centos, rocky]
  shell: [bash, zsh, sh]
  intent: [install_package, install_global]
  command: sudo dnf install -y $PACKAGE
  verify: dnf list installed $PACKAGE
  vars: [PACKAGE]
  confidence: 0.95
